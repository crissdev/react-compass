[project]
name = "react-compass-api"
version = "0.1.0"
description = "Grounded React documentation search API"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.162.0",
  "langchain>=1.4.7",
  "langchain-anthropic>=1.7.6",
  "langchain-chroma>=1.1.0",
  "langchain-core>=1.7.0",
  "langchain-openai>=1.7.2",
  "langchain-text-splitters>=1.1.3",
  "markdown-it-py>=4.2.0",
  "pydantic-settings>=2.16.1",
  "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.1.1",
  "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
